name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
    build:
      runs-on: ubuntu-latest

      steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 1. إعداد جافا (JDK 17) والمطلوبة لتشغيل Gradle في الإصدارات الحديثة
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 2. إعداد أداة Gradle Caching لتسريع عملية البناء في المرات القادمة
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      # 3. إعطاء الصلاحيات لملف الـ gradlew للتنفيذ
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 4. بناء الـ APK بنسخة الـ Debug
      - name: Build Debug APK with Gradle
        run: ./gradlew assembleDebug

      # 5. رفع ملف الـ APK الناتج كـ Artifact عشان تقدر تحمله من صفحة الـ Actions
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
